# XcodeGen 工程定义
# 云端 Mac 上用 `xcodegen generate` 一键生成 Xcode 工程文件，
# 免去手动创建 xcodeproj 的步骤

name: LiuliLedger
options:
  bundleIdPrefix: com.liuli
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

targets:
  LiuliLedger:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 琉璃记账
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
