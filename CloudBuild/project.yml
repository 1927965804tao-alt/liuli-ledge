name: LiuliLedger
options:
  bundleIdPrefix: com.liuli
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LiuliLedger:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    schemes:
      LiuliLedger:
        build:
          targets:
            LiuliLedger: all
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 琉璃记账
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
